openapi: 3.2.0
info:
  title: Cloudinary Account Provisioning Billing Usage API
  version: 0.2.0
  description: 'Accounts with provisioning API access can create and manage their **product environments**, **users** and **user groups** using the RESTful Provisioning API.


    Provisioning API access is available upon request for accounts on an Enterprise plan.


    The API uses **Basic Authentication** over HTTPS. Your **Account Management Key** and **Account Management Secret** (previously referred to as **Account API Keys** and **Provisioning API keys**) are used for the authentication. These credentials (as well as your ACCOUNT_ID) are located in the Cloudinary Console under **Settings > Account Management Keys**.


    The Provisioning API has dedicated SDKs for the following languages:


    * JavaScript

    * Python

    * PHP

    * Java


    > **Note:** The JavaScript and Python SDKs also wrap methods from the Permissions API.


    Useful links:

    * Provisioning API reference (Classic) (includes SDKs for additional languages)

    * Permissions API reference'
  contact:
    name: Cloudinary Support
    email: support@cloudinary.com
    url: https://support.cloudinary.com
  termsOfService: https://cloudinary.com/tou
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-cld-module-context: account
  x-cld-module-name: account-provisioning
servers:
- url: https://api.cloudinary.com/v1_1/provisioning/accounts/{accountId}
  variables:
    accountId:
      default: ACCOUNT_ID
      description: Your Account ID.
security:
- basicAuth: []
tags:
- name: Billing Usage
  description: Access billing usage information for your account and product environments.
  externalDocs:
    description: Learn more about billing and usage information.
    url: https://cloudinary.com/documentation/provisioning_api#billing_usage
paths:
  /billing_usage:
    get:
      tags:
      - Billing Usage
      summary: Get billing usage information
      description: 'Retrieve billing usage metrics for your account and product environments,

        including storage, bandwidth, impressions, and transformations.


        If `year` is provided:

        - **Annual subscription**: Returns the single annual usage cycle that began in the specified year (if any).

        - **Monthly subscription**: Returns all monthly usage cycles that began in the specified year.


        If `year` is not provided:

        - Returns usage for the year in which the current active subscription period began.

        - If no active subscription exists, an empty list is returned.


        **Note**: Usage metrics are updated daily, so calling this endpoint once per day gives you the latest data.'
      operationId: getBillingUsage
      parameters:
      - name: year
        in: query
        required: false
        schema:
          type: integer
          format: int32
        description: The year to retrieve billing usage for. Behavior depends on subscription type (see above).
        example: 2024
      - name: include_prodenv_breakdown
        in: query
        required: false
        schema:
          type: boolean
        description: 'Whether to include usage details by product environment. **Default**: false.

          '
      responses:
        '200':
          description: Successful operation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingUsageResponse'
              examples:
                ProPAYG:
                  $ref: '#/components/examples/BillingUsageResponse_ProPAYG'
                AdvancedExtraPAYG:
                  $ref: '#/components/examples/BillingUsageResponse_AdvancedExtraPAYG'
                AdvancedPAYG:
                  $ref: '#/components/examples/BillingUsageResponse_AdvancedPAYG'
                ProPAYGPlus:
                  $ref: '#/components/examples/BillingUsageResponse_ProPAYGPlus'
                MultiPlan:
                  $ref: '#/components/examples/BillingUsageResponse_MultiPlan'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403NotAllowed'
        '404':
          $ref: '#/components/responses/404NotFound'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
